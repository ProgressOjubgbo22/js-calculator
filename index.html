<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display" id="display"></div>
    <div class="buttons">
  <button class="btn-special" data-type="delete">⌫</button>
  <button class="btn-special" data-type="clear">AC</button>
  <button class="btn-special" data-type="percent">%</button>
  <button class="btn-operator" data-type="operator">÷</button>

  <button class="btn-number" data-type="number">7</button>
  <button class="btn-number" data-type="number">8</button>
  <button class="btn-number" data-type="number">9</button>
  <button class="btn-operator" data-type="operator">×</button>

  <button class="btn-number" data-type="number">4</button>
  <button class="btn-number" data-type="number">5</button>
  <button class="btn-number" data-type="number">6</button>
  <button class="btn-operator" data-type="operator">-</button>

  <button class="btn-number" data-type="number">1</button>
  <button class="btn-number" data-type="number">2</button>
  <button class="btn-number" data-type="number">3</button>
  <button class="btn-operator" data-type="operator">+</button>

  <button class="btn-special" data-type="toggle">+/-</button>
  <button class="btn-number zero" data-type="number">0</button>
  <button class="btn-number" data-type="decimal">.</button>
  <button class="btn-operator" data-type="equals">=</button>
</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
